name: APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dossiers plateformes manquants
        run: |
          flutter create . --platforms=web,android --project-name photo_roulette --org com.foclabroc
          rm -f test/widget_test.dart  # test généré par le modèle, inutile ici

      - run: flutter pub get

      # Signature debug pour l'instant ; clé de release à ajouter via les secrets (jamais commitée)
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: photo_roulette-apk
          path: build/app/outputs/flutter-apk/app-release.apk
